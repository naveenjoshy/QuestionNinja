<!DOCTYPE html>
<html>
<head>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css">
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.js"></script>
</head>
<body>
<div id="test" style="width: 794px;">
  <p>Q32. Evaluate <span id="math"></span> dx</p>
</div>
<script>
  window.onload = () => {
    katex.render("\\int \\frac{x}{x^2+3x+2}", document.getElementById('math'));
    const rect = document.getElementById('test').getBoundingClientRect();
    const p = document.getElementsByTagName('p')[0].getBoundingClientRect();
    
    let maxBottom = p.bottom;
    const desc = document.getElementsByTagName('*');
    for (let i = 0; i < desc.length; i++) {
       const b = desc[i].getBoundingClientRect();
       if (b.height > 0 && b.width > 0 && b.bottom > maxBottom) maxBottom = b.bottom;
    }
    console.log("p.bottom", p.bottom);
    console.log("maxBottom", maxBottom);
    console.log("diff", maxBottom - p.bottom);
  };
</script>
</body>
</html>
